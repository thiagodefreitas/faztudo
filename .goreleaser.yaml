# Release builds. Triggered by pushing a tag vX.Y.Z (see docs/versioning.md).
version: 2

project_name: faztudo

before:
  hooks:
    # The web UI is embedded; build it first once web/ exists.
    - make web

builds:
  - id: faztudo
    main: ./cmd/faztudo
    binary: faztudo
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/thiagodefreitas/faztudo/internal/version.Version={{ .Version }}
      - -X github.com/thiagodefreitas/faztudo/internal/version.Commit={{ .FullCommit }}
      - -X github.com/thiagodefreitas/faztudo/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: packaging/systemd/faztudo.service
        dst: systemd/faztudo.service
      - src: packaging/apparmor/faztudo
        dst: apparmor/faztudo

nfpms:
  - package_name: faztudo
    vendor: faztudo contributors
    homepage: https://github.com/thiagodefreitas/faztudo
    maintainer: Thiago de Freitas
    description: Chat workspace for you and the agent CLIs on your machine.
    license: MIT
    formats: [deb]
    bindir: /usr/bin
    # Write runs fail closed without bubblewrap (sandbox = "required").
    dependencies: [git, bubblewrap]
    contents:
      - src: packaging/systemd/faztudo-package.service
        dst: /usr/lib/systemd/user/faztudo.service
        file_info:
          mode: 0644
      # Installed into /etc/apparmor.d by postinst only on Ubuntu 24.04 and
      # newer, where bubblewrap needs it to create a user namespace.
      - src: packaging/apparmor/faztudo
        dst: /usr/share/faztudo/apparmor/faztudo
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/deb/postinst
      postremove: packaging/deb/postrm

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md, written by people, through
# --release-notes in the release workflow. Do not disable the changelog
# step: with it disabled the v0.1.0 release came out with empty notes.

release:
  draft: true
  prerelease: auto
