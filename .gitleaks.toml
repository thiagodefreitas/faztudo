title = "faztudo gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders and test fixtures"
paths = [
  '''\.env\.example$''',
]
regexes = [
  '''REPLACE_ME''',
  '''<your-[a-z-]+>''',
]

# Access information, not just secrets. Any machine name under ts.net
# (host.tailnet-name.ts.net, host.tail1a2b.ts.net, host.cat-crocodile.ts.net)
# identifies a private network. Only the placeholders below are allowed.
[[rules]]
id = "tailnet-hostname"
description = "Real Tailscale machine name"
regex = '''(?i)\b[a-z0-9-]+\.[a-z0-9-]+\.ts\.net\b'''
keywords = [".ts.net"]
[rules.allowlist]
regexes = ['''(?i)\b(mypc\.tailnet-name|pc\.example|box\.example)\.ts\.net\b''']
