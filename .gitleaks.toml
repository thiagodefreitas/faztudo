title = "faztudo gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders and test fixtures"
paths = [
  '''\.env\.example$''',
]
regexes = [
  '''REPLACE_ME''',
  '''<your-[a-z-]+>''',
]

# Access information, not just secrets. A real Tailscale MagicDNS name
# (host.tailXXXX.ts.net) identifies a private network; docs use
# placeholders such as mypc.tailnet-name.ts.net instead.
[[rules]]
id = "tailnet-hostname"
description = "Real Tailscale machine name"
regex = '''(?i)\b[a-z0-9-]+\.tail[0-9a-f]{4,}\.ts\.net\b'''
keywords = [".ts.net"]
