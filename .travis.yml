# Second CI, independent of GitHub Actions. Runs the same checks.
# Enable the repository at https://app.travis-ci.com to activate it.
os: linux
dist: jammy
language: go
go:
  - 1.25.x

git:
  depth: false

env:
  global:
    - GITLEAKS_VERSION=8.30.1

install:
  - curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
  - curl -sSfL -o /tmp/gitleaks_checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
  - (cd /tmp && grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" gitleaks_checksums.txt | sed 's/gitleaks_.*/gitleaks.tgz/' | sha256sum -c)
  - tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
  - go mod download

script:
  - scripts/check_authorship.sh
  - python3 scripts/lint_prose.py
  - /tmp/gitleaks detect --redact --no-banner --log-opts="--all"
  - test -z "$(gofmt -l .)"
  - go vet ./...
  - go test -race ./...
  - make build

notifications:
  email:
    on_success: never
    on_failure: always
