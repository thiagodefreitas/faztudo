name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: authorship
        env:
          # Private phase: only the maintainer commits. Cleared at go-public.
          FAZTUDO_ALLOWED_EMAILS: ${{ vars.FAZTUDO_ALLOWED_EMAILS }}
        run: scripts/check_authorship.sh
      - name: prose
        run: python3 scripts/lint_prose.py
      - name: secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: if [ -f go.mod ]; then echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v5
        if: steps.has.outputs.go == 'true'
        with:
          go-version-file: go.mod
      - if: steps.has.outputs.go == 'true'
        run: go vet ./... && go test -race ./...

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: scripts/check_licenses.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: if [ -f web/package.json ]; then echo "web=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.has.outputs.web == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.has.outputs.web == 'true'
        working-directory: web
        run: npm ci && npm run typecheck && npm run lint && npm test

  e2e:
    runs-on: ubuntu-latest
    # The browser install pulls system packages; a stuck mirror once held
    # this job for over half an hour.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
